<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5fbff"/>
      <stop offset="1" stop-color="#caf0f8"/>
    </linearGradient>
    <linearGradient id="cam" x1="50" y1="40" x2="150" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#03045e"/>
      <stop offset="1" stop-color="#0077b6"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="24" fill="url(#bg)"/>
  <!-- Camera body -->
  <rect x="40" y="65" width="120" height="85" rx="14" fill="url(#cam)"/>
  <!-- Camera top -->
  <rect x="75" y="50" width="40" height="20" rx="6" fill="#03045e" opacity="0.8"/>
  <!-- Flash -->
  <circle cx="60" cy="60" r="5" fill="#00b4d8" opacity="0.5"/>
  <!-- Lens outer -->
  <circle cx="100" cy="105" r="30" fill="#0077b6" stroke="white" stroke-width="2" opacity="0.8"/>
  <!-- Lens inner -->
  <circle cx="100" cy="105" r="20" fill="#00b4d8"/>
  <!-- Lens reflection -->
  <circle cx="93" cy="98" r="6" fill="white" opacity="0.4"/>
  <circle cx="108" cy="112" r="3" fill="white" opacity="0.2"/>
  <!-- Shutter button -->
  <circle cx="145" cy="57" r="7" fill="#00b4d8" stroke="white" stroke-width="1.5"/>
  <!-- Sparkle effects -->
  <path d="M30 40 L32 34 L34 40 L40 42 L34 44 L32 50 L30 44 L24 42Z" fill="#00b4d8" opacity="0.3"/>
  <path d="M165 35 L166 31 L167 35 L171 36 L167 37 L166 41 L165 37 L161 36Z" fill="#0077b6" opacity="0.3"/>
  <!-- Product box hint -->
  <rect x="55" y="160" width="90" height="6" rx="3" fill="#03045e" opacity="0.08"/>
  <rect x="70" y="172" width="60" height="5" rx="2.5" fill="#03045e" opacity="0.05"/>
</svg>
