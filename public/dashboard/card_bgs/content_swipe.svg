<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#caf0f8"/>
      <stop offset="1" stop-color="#90e0ef"/>
    </linearGradient>
    <linearGradient id="card" x1="40" y1="40" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0077b6"/>
      <stop offset="1" stop-color="#00b4d8"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="24" fill="url(#bg)"/>
  <!-- Back card -->
  <rect x="65" y="35" width="95" height="120" rx="12" fill="#03045e" opacity="0.15" transform="rotate(8 112 95)"/>
  <!-- Middle card -->
  <rect x="55" y="40" width="95" height="120" rx="12" fill="#0077b6" opacity="0.3" transform="rotate(3 102 100)"/>
  <!-- Front card -->
  <rect x="45" y="50" width="95" height="120" rx="12" fill="url(#card)"/>
  <!-- Swipe arrow -->
  <path d="M155 100 L175 100 M170 90 L180 100 L170 110" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <!-- Heart icon on card -->
  <path d="M80 85 C80 78, 92 75, 92 85 C92 75, 104 78, 104 85 C104 100, 92 108, 92 108 C92 108, 80 100, 80 85Z" fill="white" opacity="0.9"/>
  <!-- Lines on card -->
  <rect x="60" y="125" width="55" height="4" rx="2" fill="white" opacity="0.5"/>
  <rect x="60" y="135" width="40" height="4" rx="2" fill="white" opacity="0.3"/>
</svg>
